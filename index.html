<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Power Tracker</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Power Tracker">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<script defer src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
/* Layout: one-column phone app. Calorie ring is the hero; logged foods orbit it. Sheets slide up from the bottom. */
:root{
  --bg:#000;
  --card:#141416;
  --card-2:#1c1c1f;
  --line:#2a2a2e;
  --fg:#f5f5f7;
  --muted:#8e8e93;
  --red:#ff2d3d;
  --red-deep:#b3121f;
  --protein:#ff5c7a;
  --carbs:#ff9f0a;
  --fat:#ffd60a;
  --good:#30d158;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
  color-scheme:dark;
}
html{padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--fg);overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none;max-width:100%}
body{font-family:var(--font-ui);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.lock,html.lock body{overflow:hidden}
*{box-sizing:border-box;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--fg)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}
.app{max-width:480px;margin:0 auto;overflow-x:clip;width:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;display:flex;flex-direction:column;gap:18px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:800}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10;margin:-12px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-left,0px)) 10px;background:rgba(0,0,0,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}

/* quote */
.quote{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:12px 14px;font-weight:600;font-size:15px;line-height:1.35;color:#e5e5ea}
.quote svg{flex:none;margin-top:1px}
.quote.in span{animation:qin .5s ease both}
@keyframes qin{from{opacity:0;transform:translateY(4px)}}

/* press feedback, like a native app */
.btn,.icon-btn,.nudge,.quote,.chip,.tab,.stepper button,.meal-add{transition:transform .12s,opacity .12s}
.btn:active,.icon-btn:active,.nudge:active,.quote:active,.chip:active,.tab:active,.stepper button:active,.meal-add:active{transform:scale(.97);opacity:.8}
.row:active{background:var(--card-2)}
.datebar button:active,.close:active{opacity:.5}
/* wordmark: Power Vape's logo style (lowercase Sora, power symbol as the "o"), in the app's red */
@font-face{font-family:"Sora";src:url("fonts/sora-latin-wght-normal.woff2") format("woff2");font-weight:100 800;font-display:swap}
.logo{display:inline-flex;align-items:baseline;margin:0;font-family:"Sora",var(--font-ui);font-weight:500;font-size:25px;letter-spacing:-.02em;line-height:1;white-space:nowrap;color:#fff}
.logo svg{width:.64em;height:.69em;margin:0 .01em -.02em;color:var(--red);filter:drop-shadow(0 0 5px rgba(255,45,61,.55))}
.logo .gap{width:.28em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:8px}
.streak{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 8px;font-size:14px}
.streak .num{font-size:15px}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}

.datebar{display:flex;align-items:center;justify-content:center;gap:14px}
.datebar button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.datebar button:disabled{opacity:.25;cursor:default}
.datebar .label{font-weight:700;min-width:150px;text-align:center}
.datebar .label small{display:block;color:var(--muted);font-weight:500;font-size:12px}

/* setup nudge */
.nudge{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;text-align:left;width:100%;font-weight:600}
.nudge span{flex:1}
.nudge .go{color:var(--muted)}

/* ring + orbit */
.stage{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto;max-width:100%}
.ring-btn{position:absolute;inset:18%;border-radius:50%;display:grid;place-items:center;transition:transform .2s}
.ring-btn:active{transform:scale(.96)}
.ring-btn .ring-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:#26090c;stroke-width:16}
.ring-prog{fill:none;stroke:url(#ringGrad);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring-glow{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(255,45,61,.16),transparent 70%);pointer-events:none}
/* liquid fill: rises with calories eaten (--lvl 0..1), sloshes when food is added */
.liquid{position:absolute;inset:9%;border-radius:50%;overflow:hidden;-webkit-mask-image:-webkit-radial-gradient(white,black);--lvl:0}
.liquid .tilt{position:absolute;inset:-25%}
.liquid.slosh .tilt{animation:slosh 1.4s ease-out}
.wave{position:absolute;left:0;width:200%;height:100%;top:calc(16.667% + (1 - var(--lvl)) * 66.667% - 3%);transition:top .9s cubic-bezier(.2,.8,.2,1);animation:wave 6s linear infinite}
.wave.back{fill:rgba(179,18,31,.5);animation-duration:9s;animation-direction:reverse}
.wave.front{fill:rgba(255,45,61,.34);filter:drop-shadow(0 -2px 6px rgba(255,45,61,.7))}
.liquid.over .wave.front{fill:rgba(255,45,61,.55);animation:wave 6s linear infinite,hot 1.6s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(-50%)}}
@keyframes slosh{15%{transform:rotate(-8deg)}40%{transform:rotate(6deg)}65%{transform:rotate(-3deg)}85%{transform:rotate(1deg)}}
@keyframes hot{to{opacity:.7}}
.log-pill{box-shadow:0 2px 10px rgba(0,0,0,.45)}
.ring-center{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.ring-center .big{font-size:42px;line-height:1;letter-spacing:-.02em}
.ring-center .sub{color:var(--muted);font-size:13px}
.log-pill{margin-top:12px;background:var(--red);color:#fff;border-radius:999px;padding:6px 14px 6px 11px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px}
.log-pill svg{width:12px;height:12px;flex:none}
.summary{text-align:center;color:var(--muted);font-size:13px;margin-top:-6px}
.summary b{color:var(--fg);font-family:var(--font-num);font-weight:800}
.orbit{position:absolute;inset:0;pointer-events:none}
.bubble{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);pointer-events:auto;will-change:transform}
.bubble-in{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 25%,#2c2c30,#161618 70%);border:1px solid #333338;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);animation:bob var(--d) ease-in-out infinite alternate,pop .5s cubic-bezier(.2,1.6,.4,1) both}
.bubble-in .em{font-size:calc(var(--s)*.4);line-height:1}
.bubble-in .k{font-family:var(--font-num);font-weight:800;font-size:clamp(9px,calc(var(--s)*.18),12px);color:var(--muted);margin-top:1px}
.bubble.junk .bubble-in{border-color:rgba(255,159,10,.75);box-shadow:0 0 16px rgba(255,159,10,.45),0 8px 22px rgba(0,0,0,.6)}
.bubble.clean .bubble-in{border-color:rgba(48,209,88,.75);box-shadow:0 0 16px rgba(48,209,88,.4),0 8px 22px rgba(0,0,0,.6)}
.legend{display:flex;justify-content:center;gap:14px;color:var(--muted);font-size:12px;margin-top:-10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.bubble.more .bubble-in{background:var(--card-2)}
.bubble.more .em{font-family:var(--font-num);font-weight:900;font-size:15px;color:var(--fg)}
.ghost{position:absolute;inset:8%;border-radius:50%;border:1px dashed #1f1f23;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(5px)}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* macros */
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.macro .name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.macro .val{font-size:19px;line-height:1;white-space:nowrap}
.macro .val small{font-size:11.5px;color:var(--muted);font-family:var(--font-ui);font-weight:500}
.bar{height:6px;border-radius:3px;background:#242427;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .6s}

/* diary */
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 0}
.section-h h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0}
.section-h span{color:var(--muted);font-size:13px}
.meal{background:var(--card);border-radius:16px;overflow:hidden}
.meal-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.meal-h b{font-size:15px}
.meal-h .num{font-size:15px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.row .em{width:34px;height:34px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;font-size:18px;flex:none}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .txt span{color:var(--muted);font-size:12.5px}
.row .kc{font-size:15px}
.meal-add{display:flex;align-items:center;gap:6px;color:var(--red);font-weight:700;font-size:14px;padding:10px 14px;border-top:1px solid var(--line);width:100%}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:18px 8px;background:var(--card);border-radius:16px}

/* coach */
.coach{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.coach-h{display:flex;align-items:center;gap:12px}
.grade{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-family:var(--font-num);font-weight:900;font-size:25px;flex:none;color:#000}
.coach-h .flabel{display:block;margin-bottom:2px}
.coach-head{margin:0;font-weight:800;font-size:16px;line-height:1.3}
.coach-list{list-style:none;margin:0;padding:12px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.coach-list li{display:flex;gap:10px;font-size:14px;line-height:1.4;color:#d1d1d6}
.coach-list li i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.coach-list b{color:var(--fg)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:#0f0f11;border-radius:22px 22px 0 0;border-top:1px solid var(--line);max-height:92%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.2,1)}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.sheet.z2{z-index:31}.scrim.z2{z-index:30}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;touch-action:none;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheet-h::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;border-radius:3px;background:#3a3a3e;transform:translateX(-50%)}
.sheet-h h3{margin:8px 0 0;font-size:18px;font-weight:800}
.sheet-h .close{margin-top:8px;color:var(--red);font-weight:700}
.sheet-b{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}

.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:#2c2c30;color:var(--fg)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{background:var(--card);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid transparent}
.tab.on{color:var(--fg);border-color:var(--red);background:rgba(255,45,61,.1)}
.tab svg{width:22px;height:22px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{padding:6px 12px;border-radius:999px;background:var(--card);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--fg);color:#000}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px}
.search input{flex:1;background:none;border:0;padding:12px 0;outline:none;min-width:0}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.list .row:first-child{border-top:0}
.list-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:2px 2px -6px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:#26262a;color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.ai{background:rgba(255,159,10,.15);color:var(--carbs)}
.btn{background:var(--red);color:#fff;font-weight:700;border-radius:14px;padding:14px;width:100%;font-size:16px}
.btn:disabled{opacity:.4}
.btn.ghosty{background:var(--card);color:var(--fg)}
.btn.danger{background:transparent;color:var(--red);border:1px solid #3a1418}
.drop{border:1.5px dashed #3a3a3e;border-radius:18px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.drop b{font-size:16px}
.drop span{color:var(--muted);font-size:13px}
.drop input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.status{color:var(--muted);font-size:13.5px;text-align:center;min-height:1.2em}
.status.err{color:var(--red)}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid #333;border-top-color:var(--red);animation:spin .8s linear infinite;display:inline-block;vertical-align:-4px;margin-right:6px}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.inp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
.inp:focus{border-color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2>*,.grid3>*{min-width:0}
.group{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.group h4{margin:0;font-size:15px}
.target{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.target .num{font-size:30px;color:var(--red)}
.hint{color:var(--muted);font-size:12.5px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch input{width:46px;height:28px;appearance:none;background:#3a3a3e;border-radius:14px;position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked{background:var(--good)}
.switch input:checked::after{transform:translateX(18px)}

/* food detail */
.fd-hero{display:flex;align-items:center;gap:14px}
.fd-hero .em{width:58px;height:58px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:30px;flex:none}
.fd-hero h4{margin:0;font-size:19px;line-height:1.2}
.fd-hero span{color:var(--muted);font-size:13px}
.fd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fd-stats div{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center}
.fd-stats .num{font-size:20px;display:block}
.fd-stats small{font-size:11px;color:var(--muted);font-weight:600}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:6px}
.stepper button{width:44px;height:44px;border-radius:10px;background:#242427;font-size:22px;font-weight:700}
.stepper .num{font-size:24px}
.stepper small{display:block;text-align:center;color:var(--muted);font-size:12px;font-family:var(--font-ui);font-weight:500}
.check{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input[type=checkbox]{width:22px;height:22px;accent-color:var(--red);flex:none}
.check .txt{flex:1;min-width:0}
.check .txt b{display:block;font-weight:600}
.check .txt span{color:var(--muted);font-size:12.5px}
.mini{width:62px;padding:7px;text-align:center;background:#242427;border:1px solid var(--line);border-radius:9px;outline:none}

@media (prefers-reduced-motion:reduce){
  .bubble-in,.quote.in span,.wave,.liquid .tilt{animation:none!important}
  .sheet,.scrim,.ring-prog{transition:none}
}
/* live scanner */
.scan{position:relative;width:100%;aspect-ratio:3/4;max-height:52vh;border-radius:20px;overflow:hidden;background:#0b0b0d}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan .frame{position:absolute;left:12%;right:12%;top:36%;bottom:36%;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.85)}
.scan .laser{position:absolute;left:14%;right:14%;top:50%;height:2px;background:var(--red);box-shadow:0 0 12px var(--red);animation:laser 1.6s ease-in-out infinite alternate}
.scan.hit .frame{border-color:var(--good)}
.scan.hit .laser{background:var(--good);box-shadow:0 0 12px var(--good)}
.scan .msg{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:13px;color:#fff;text-shadow:0 1px 4px #000}
.scan-off{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;height:100%;color:var(--muted)}
@keyframes laser{from{transform:translateY(-26px)}to{transform:translateY(26px)}}
.backup{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.backup label{display:flex;align-items:center;justify-content:center}
.backup input{display:none}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">

  persist("day-"+date, day);

/* ---------------- math ---------------- */
function targets(){
  const pct = P.macro === "custom" ? P.custom : MACRO_PRESETS[P.macro].slice(0,3);
  let kcal;
  if (P.override) kcal = +P.overrideKcal || 2000;
  else {
    const bmr = 10*P.weightKg + 6.25*P.heightCm - 5*P.age + (P.sex === "male" ? 5 : -161);
    kcal = Math.max(P.sex === "male" ? 1500 : 1200, Math.round((bmr*P.activity + P.goal)/10)*10);
  }
  return { kcal, p: Math.round(kcal*pct[0]/100/4), c: Math.round(kcal*pct[1]/100/4), f: Math.round(kcal*pct[2]/100/9), pct };
}
const entryTotals = e => ({kcal:e.kcal*e.qty, p:e.p*e.qty, c:e.c*e.qty, f:e.f*e.qty});

}

  return n;
}

const CIRC = 2*Math.PI*118;
$("ringProg").style.strokeDasharray = CIRC;
$("ringProg").style.strokeDashoffset = CIRC; // start empty so the ring fills up on open instead of draining

function render(){
  const T = targets(), tot = totals(day.entries);
  const left = T.kcal - tot.kcal;
  $("remainN").textContent = E(Math.abs(left)).toLocaleString();
  $("remainL").textContent = left >= 0 ? `${EU()} left` : `${EU()} over`;
  $("remainL").style.color = left >= 0 ? "" : "var(--red)";
  $("summary").innerHTML = `<b>${E(tot.kcal).toLocaleString()}</b> eaten of <b>${E(T.kcal).toLocaleString()}</b> ${EU()}`;
  const frac = Math.min(1, tot.kcal / T.kcal);
  $("ringProg").style.strokeDashoffset = CIRC * (1 - frac);
  $("liquid").style.setProperty("--lvl", frac.toFixed(3));
  $("liquid").classList.toggle("over", left < 0);

  const s = streak();
  $("streakN").textContent = s;
  $("streakL").textContent = s === 1 ? "day" : "days";
  $("nudge").hidden = P.setup;

  // date
  const isToday = date === todayISO();
  const d = new Date(date+"T12:00:00");
  const y = new Date(); y.setDate(y.getDate()-1);
  const main = isToday ? "Today" : date === y.toLocaleDateString("en-CA") ? "Yesterday" : d.toLocaleDateString("en-CA",{weekday:"long"});
  $("dateLabel").innerHTML = `${main}<small>${d.toLocaleDateString("en-CA",{month:"long",day:"numeric",year:"numeric"})}</small>`;
  $("nextDay").disabled = isToday;

  // macros
  const M = [["Protein","p","--protein"],["Carbs","c","--carbs"],["Fat","f","--fat"]];
  $("macros").innerHTML = M.map(([n,k,col]) => {
    const v = tot[k], g = T[k], w = Math.min(100, g ? v/g*100 : 0);
    return `<div class="macro"><span class="name" style="color:var(${col})">${n}</span>
      <span class="val num">${Math.round(v)}<small> / ${g} g</small></span>
      <div class="bar"><i style="width:${w}%;background:var(${col})"></i></div></div>`;
  }).join("");

  renderOrbit();
  renderDiary();
  renderCoach(T, tot);
}

let orbitEls = [], rot = 0, lastT = 0;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function renderOrbit(){
  const o = $("orbit");
  const list = day.entries.slice().sort((a,b)=>a.t-b.t);
  const max = 8;
  const shown = list.length > max ? list.slice(-(max-1)) : list;
  const extra = list.length - shown.length;
  const n = shown.length + (extra ? 1 : 0);
  let html = "";
  shown.forEach((e,i) => {
    const k = e.kcal*e.qty;
    // size follows real calories: a black coffee is tiny, a poutine is huge
    const size = Math.round(Math.min(64, 30 + Math.sqrt(k)*1.3));
    const dur = (2.6 + (i%4)*0.55).toFixed(2);
    const fresh = e.id === lastAddedId;
    const kind = foodKind(e);
    html += `<button class="bubble ${kind}" data-entry="${e.id}" data-i="${i}" style="--s:${size}px;--d:${dur}s" aria-label="${esc(e.name)}, ${E(k)} ${EU()}${kind ? ", "+kind+" food" : ""}">
      <span class="bubble-in" style="${fresh ? "" : "animation:bob var(--d) ease-in-out -"+(i*0.7).toFixed(1)+"s infinite alternate"}"><span class="em">${esc(e.emoji||"🍽️")}</span><span class="k">${E(k)}</span></span></button>`;
  });
  if (extra) html += `<button class="bubble more" data-more="1" data-i="${shown.length}" style="--s:40px;--d:3s" aria-label="${extra} more foods">
      <span class="bubble-in" style="animation:bob 3s ease-in-out infinite alternate"><span class="em">+${extra}</span></span></button>`;
  o.innerHTML = html;
  orbitEls = [...o.children].map(el => ({el, s: parseFloat(el.style.getPropertyValue("--s")), base: (-90 + (+el.dataset.i)*(360/Math.max(n,1))) * Math.PI/180}));
  placeBubbles();
  lastAddedId = null;
  const kinds = shown.map(foodKind);
  $("legend").hidden = !kinds.some(Boolean);
}
function placeBubbles(){
  const W = $("stage").clientWidth; if (!W) return;
  for (const {el, s, base} of orbitEls) {
    const R = W/2 - s/2 - 3; // each bubble hugs the stage edge, so big ones stay clear of the ring
    const a = base + rot;
    el.style.transform = `translate(${(W/2 + Math.cos(a)*R).toFixed(1)}px,${(W/2 + Math.sin(a)*R).toFixed(1)}px)`;
  }
}
function tick(t){
  if (lastT && !reduceMotion && orbitEls.length && !document.hidden) { rot += (t-lastT) * (2*Math.PI/90000); placeBubbles(); }
  lastT = t; requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
addEventListener("resize", placeBubbles);

function renderDiary(){
  const wrap = $("diary");
  $("diaryCount").textContent = day.entries.length ? `${day.entries.length} item${day.entries.length>1?"s":""}` : "";
  const meals = MEALS.filter(m => day.entries.some(e => e.meal === m));
  if (!meals.length) { wrap.innerHTML = `<div class="empty">Nothing logged yet. Tap the ring to add food.</div>`; return; }
  wrap.innerHTML = meals.map(m => {
    const items = day.entries.filter(e => e.meal === m);
    const t = totals(items);
    return `<div class="meal">
      <div class="meal-h"><b>${m}</b><span class="num">${E(t.kcal).toLocaleString()}</span></div>
      ${items.map(e => { const et = entryTotals(e); return `<button class="row" data-entry="${e.id}">
        <span class="em">${esc(e.emoji||"🍽️")}</span>
        <span class="txt"><b>${esc(e.name)}</b><span>${e.qty !== 1 ? fmtG(e.qty)+" × " : ""}${esc(e.serving)}</span></span>
        <span class="kc num">${E(et.kcal)}</span></button>`; }).join("")}
    </div>`;
  }).join("");
}

// stop the page behind an open sheet from scrolling
const syncLock = () => document.documentElement.classList.toggle("lock", !!document.querySelector(".sheet.on"));
function openSheet(name){ if (name === "Detail") stopScan(); $("sheet"+name).classList.add("on"); $("scrim"+name).classList.add("on"); syncLock(); }
function closeSheet(name){
  $("sheet"+name).classList.remove("on"); $("scrim"+name).classList.remove("on"); syncLock();
  if (name === "Log") stopScan();
  if (name === "Detail" && tab === "barcode" && $("sheetLog").classList.contains("on")) startScan();
}
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => closeSheet(b.dataset.close));
["Log","Detail","Settings"].forEach(n => $("scrim"+n).onclick = () => closeSheet(n));
// swipe a sheet down by its top bar to close it
document.querySelectorAll(".sheet").forEach(sh => {
  const name = sh.id.slice(5), h = sh.querySelector(".sheet-h");
  let y0 = null, dy = 0;
  h.addEventListener("touchstart", e => { if (e.target.closest("button")) return; y0 = e.touches[0].clientY; dy = 0; sh.classList.add("drag"); }, {passive:true});
  h.addEventListener("touchmove", e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, {passive:true});
  const end = () => { if (y0 == null) return; y0 = null; sh.classList.remove("drag"); sh.style.transform = ""; if (dy > 90) closeSheet(name); };
  h.addEventListener("touchend", end); h.addEventListener("touchcancel", end);
});
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const top = ["Detail","Log","Settings"].find(n => $("sheet"+n).classList.contains("on"));
  if (top) closeSheet(top);
});

function renderResults(){
  const q = $("q").value.trim().toLowerCase();
  pickList = [];
  let html = "";
  const add = (label, arr, tagFn) => {
    if (!arr.length) return;
    html += `<div class="list-label">${label}</div><div class="list">` + arr.map(f => { pickList.push(f); return rowHTML(f, pickList.length-1, tagFn ? tagFn(f) : ""); }).join("") + `</div>`;
  };
  if (!q) {
    add("Recent", P.recents.slice(0,8));
    add("Popular", FOOD_OBJS.filter(f => ["Chicken breast, cooked","Egg, large","White rice, cooked","Banana","Greek yogurt, plain 0%","Tim Hortons Double-Double","Chicken shawarma wrap","Whey protein powder"].includes(f.name)));
  } else {
    const words = q.split(/\s+/);
    const score = f => { const n = (f.name+" "+(f.brand||"")+" "+(f.group||"")).toLowerCase(); return words.every(w => n.includes(w)) ? (n.startsWith(q) ? 2 : 1) : 0; };
    const mine = P.recents.filter(f => score(f)).slice(0,5);
    const hits = FOOD_OBJS.map(f => [f, score(f)]).filter(x => x[1]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,25);
    add("Your foods", mine);

    html += `<div class="status" id="aiStatus"></div>`;

/* ---------------- Open Food Facts ---------------- */
const num = v => { const n = parseFloat(v); return isFinite(n) && n >= 0 ? Math.round(n*10)/10 : 0; };
const OFF = "https://world.openfoodfacts.org";
const OFF_FIELDS = "code,product_name,product_name_en,product_name_fr,brands,serving_size,serving_quantity,nutriments,categories_tags";
function emojiFor(p){
  const t = ((p.categories_tags||[]).join(" ")+" "+(p.product_name||"")).toLowerCase();
  const map = [["chocolate","🍫"],["candy","🍬"],["chip","🍟"],["crisp","🍟"],["cookie","🍪"],["biscuit","🍪"],["cereal","🥣"],["yogurt","🥣"],["yoghurt","🥣"],["milk","🥛"],["cheese","🧀"],["bread","🍞"],["pasta","🍝"],["rice","🍚"],["juice","🧃"],["soda","🥤"],["soft-drink","🥤"],["beverage","🥤"],["water","💧"],["coffee","☕"],["tea","🍵"],["beer","🍺"],["wine","🍷"],["protein","💪"],["bar","🍫"],["peanut","🥜"],["nut","🌰"],["chicken","🍗"],["beef","🥩"],["meat","🥩"],["fish","🐟"],["tuna","🐟"],["egg","🥚"],["fruit","🍎"],["vegetable","🥦"],["soup","🍲"],["pizza","🍕"],["ice-cream","🍨"],["sauce","🥫"],["frozen","🧊"],["snack","🍿"]];
  for (const [k,e] of map) if (t.includes(k)) return e;
  return "🛒";
}
function fromOFF(p){
  const n = p.nutriments || {};
  const name = p.product_name_en || p.product_name || p.product_name_fr;
  if (!name) return null;
  const hasServ = n["energy-kcal_serving"] != null || n["proteins_serving"] != null;
  const g = k => num(hasServ ? n[k+"_serving"] : n[k+"_100g"]);
  let kcal = hasServ ? n["energy-kcal_serving"] : n["energy-kcal_100g"];
  if (kcal == null) { const kj = hasServ ? n["energy-kj_serving"] ?? n["energy_serving"] : n["energy-kj_100g"] ?? n["energy_100g"]; if (kj != null) kcal = kj/4.184; }
  const f = { name: String(name).trim().slice(0,80), brand: String(p.brands||"").split(",")[0].trim().slice(0,40),
    serving: hasServ ? String(p.serving_size || "1 serving").slice(0,40) : "100 g",
    kcal: Math.round(num(kcal)), p: g("proteins"), c: g("carbohydrates"), f: g("fat"), emoji: emojiFor(p), src: "off" };
  if (!f.kcal && !f.p && !f.c && !f.f) return null;
  return f;
}
async function offProduct(code){
  const tries = [code]; if (/^\d{12}$/.test(code)) tries.push("0"+code); if (/^0\d{12}$/.test(code)) tries.push(code.slice(1));
  for (const c of tries) {
    const r = await fetch(`${OFF}/api/v2/product/${c}.json?fields=${OFF_FIELDS}`);
    if (!r.ok) continue;
    const j = await r.json();
    if (j.status === 1 && j.product) { const f = fromOFF(j.product); if (f) return f; }
  }
  return null;
}
async function aiLookup(){
  const q = $("q").value.trim(); if (!q) return;
  const st = $("aiStatus"); st.className = "status"; st.innerHTML = `<span class="spinner"></span>Searching…`;
  $("aiLookup").disabled = true;
  try {
    const url = `${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&fields=${OFF_FIELDS}&tagtype_0=countries&tag_contains_0=contains&tag_0=canada`;
    const r = await fetch(url); if (!r.ok) throw 0;
    const j = await r.json();
    const items = (j.products||[]).map(fromOFF).filter(Boolean).slice(0,12);
    aiResults = items; aiFor = q.toLowerCase();
    renderResults();
    const s2 = $("aiStatus"); if (s2) s2.textContent = items.length ? "" : "Nothing found online. Try fewer words, or use Quick add.";
  } catch {
    const s2 = $("aiStatus"); if (s2) { s2.className = "status err"; s2.textContent = "Couldn't reach the food database. Check your connection."; }
    const b = $("aiLookup"); if (b) b.disabled = false;
  }
}

/* ---------------- live barcode scanner ---------------- */
let reader = null, scanning = false, handling = false;
function scanMsg(t){ const m = $("scanMsg"); if (m) m.textContent = t; }
async function startScan(){
  if (scanning) return;
  $("bcStatus").textContent = ""; $("bcStatus").className = "status";
  $("scanBox").classList.remove("hit");
  if (!window.ZXing || !navigator.mediaDevices?.getUserMedia) { scanOff("Live scanning isn't supported here. Use a photo instead."); return; }
  try {
    const hints = new Map();
    const F = ZXing.BarcodeFormat;
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E]);
    reader = new ZXing.BrowserMultiFormatReader(hints, 250);
    scanning = true; handling = false;
    scanMsg("Point at a barcode");
    await reader.decodeFromConstraints({ audio:false, video:{ facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720} } }, $("scanVideo"), (res) => {
      if (res && !handling) onCode(res.getText());
    });
  } catch (e) {
    scanning = false;
    const denied = e && (e.name === "NotAllowedError" || e.name === "SecurityError");
    scanOff(denied ? "Camera access is off. Allow it in Settings › Safari › Camera, then reopen." : "Couldn't start the camera. Use a photo instead.");
  }
}
function stopScan(){
  scanning = false;
  try { reader && reader.reset(); } catch {}
  reader = null;
}
function scanOff(text){
  stopScan();
  const st = $("bcStatus"); st.className = "status err"; st.textContent = text;
}
async function onCode(code){
  handling = true;
  $("scanBox").classList.add("hit");
  scanMsg(code);
  if (navigator.vibrate) try { navigator.vibrate(30); } catch {}
  stopScan();
  await lookupCode(code);
}
async function lookupCode(code){
  const st = $("bcStatus"); st.className = "status";
  if (P.barcodes[code]) { st.textContent = ""; openDetail({food: Object.assign({}, P.barcodes[code]), barcode: code}); return; }
  st.innerHTML = `<span class="spinner"></span>Looking up ${esc(code)}…`;
  try {
    const food = await offProduct(code);
    if (food) { st.textContent = ""; openDetail({food, barcode: code}); return; }
    st.textContent = "Not in the database yet. Enter it from the label once and it's saved for next time.";
  } catch {
    st.className = "status err"; st.textContent = "Couldn't reach the food database. Enter it from the label instead.";
  }
  openDetail({food: {name:"", brand:"", serving:"1 serving", kcal:0, p:0, c:0, f:0, emoji:"🛒", src:"manual"}, barcode: code});
}
async function decodeBarcode(file){
  const url = URL.createObjectURL(file);
  try {
    if ("BarcodeDetector" in window) {
      try { const r = await new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]}).detect(await createImageBitmap(file)); if (r[0]) return r[0].rawValue; } catch {}
    }
    if (window.ZXing) { try { const r = await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url); if (r) return r.getText(); } catch {} }
    return null;
  } finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
}
$("bcFile").onchange = async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  stopScan();
  const st = $("bcStatus"); st.className = "status"; st.innerHTML = `<span class="spinner"></span>Reading barcode…`;
  const code = await decodeBarcode(file);
  if (!code) { st.className = "status err"; st.textContent = "Couldn't find a barcode in that photo. Try closer, with good light."; return; }
  lookupCode(code);
};
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {

  checkNewDay();
  if (Date.now() - hiddenAt > 30000) showQuote(); // coming back to the app counts as a new visit

});

/* ---------------- add / edit entries ---------------- */
function addEntry(food, qty, m, remember=true){
  const e = { id: "e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), t: Date.now(), meal: m, qty,
    name: food.name, brand: food.brand||"", serving: food.serving, kcal: food.kcal, p: food.p, c: food.c, f: food.f, emoji: food.emoji||"🍽️", src: food.src||"db" };
  day.entries.push(e);
  lastAddedId = e.id;
  if (remember) rememberFood(food);
  saveDay(); render();
  const lq = $("liquid"); lq.classList.remove("slosh"); void lq.offsetWidth; lq.classList.add("slosh");
  if (navigator.vibrate) try { navigator.vibrate(12); } catch {}
}
function rememberFood(food){
  const key = (food.name+"|"+food.serving).toLowerCase();
  const slim = {name:food.name, brand:food.brand||"", serving:food.serving, kcal:food.kcal, p:food.p, c:food.c, f:food.f, emoji:food.emoji, src:food.src};
  const rec = [slim, ...P.recents.filter(r => (r.name+"|"+r.serving).toLowerCase() !== key)].slice(0,40);
  setProfile({recents: rec});
}

/* ---------------- coach: brutally honest read of the day ----------------
   Rules, not AI: runs on the phone, nothing is sent anywhere. Judges against how far through the day it is,
   so a light breakfast at 9am isn't "under-eating". Shows the worst 3 problems and how to fix them. */
const JUNK_RE = /chip|fries|poutine|donut|timbit|candy|chocolate|cookie|cake|tart|nanaimo|ice cream|pizza|burger|nugget|fried|cola|soda|energy drink|iced capp|double-double|kraft dinner|donair|shawarma plate|ginger beef/i;
const SUGAR_DRINK_RE = /cola|soda|pop\b|energy drink|iced capp|double-double|juice|chocolate milk|frappuccino|slush|lemonade|sweet tea|soft.drink/i;
const BOOZE_RE = /beer|wine|caesar|vodka|whisk|rum\b|tequila|gin\b|cocktail|cider|seltzer|margarita/i;
const PLANT_RE = /salad|broccoli|spinach|carrot|bean|lentil|chickpea|apple|banana|orange|berr|grape|mango|vegetable|veggie|fruit|avocado|potato|corn|pepper|tomato|cucumber|kale|peas/i;
const PLANT_EMOJI = ["🥦","🥬","🥗","🥕","🌽","🫛","🥑","🍌","🍎","🍊","🍓","🫐","🍇","🥭","🍠","🥔","🫘","🍅","🥒","🍐","🍑","🍍","🥝","🍉"];
// bubble glow: junk = fried/sugary/booze, clean = fruit/veg or protein-dense; everything else stays plain
function foodKind(e){
  if ((JUNK_RE.test(e.name) && !/protein/i.test(e.name)) || (SUGAR_DRINK_RE.test(e.name) && !/diet|zero/i.test(e.name)) || BOOZE_RE.test(e.name)) return "junk";
  if (PLANT_RE.test(e.name) || PLANT_EMOJI.includes(e.emoji) || (e.kcal > 0 && e.p*4/e.kcal >= 0.3)) return "clean";
  return "";
}
const GRADE_COL = {A:"var(--good)", B:"#a8e05f", C:"var(--fat)", D:"var(--carbs)", F:"var(--red)"};

function renderCoach(T, tot){
  const box = $("coach"), list = day.entries;
  const now = new Date(), isToday = date === todayISO();
  const h = now.getHours() + now.getMinutes()/60;
  // how much of the day's food should be in by now: 0 at 7am, all of it by 8pm
  const frac = isToday ? Math.min(1, Math.max(0, (h - 7) / 13)) : 1;
  const final = !isToday || h >= 21;
  const seed = [...date].reduce((a,ch) => a + ch.charCodeAt(0), 0) + list.length;
  const pick = arr => arr[seed % arr.length];
  const u = EU();

  if (!list.length) {
    const head = !isToday ? "You logged nothing. Can't fix what you don't track."
      : h < 11 ? "Nothing logged yet. Breakfast is a thing, look it up."
      : "It's past " + (h < 12 ? "11" : now.toLocaleTimeString("en-CA",{hour:"numeric"})) + " and you've logged nothing. Either you're starving or you're lying to the app.";
    box.innerHTML = `<div class="coach-h"><span class="grade" style="background:#2c2c30;color:var(--muted)">?</span><div><span class="flabel">Coach</span><p class="coach-head">${esc(head)}</p></div></div>`;
    return;
  }

  const kcalOf = e => e.kcal*e.qty;
  const isJunk = e => JUNK_RE.test(e.name) && !/protein/i.test(e.name);
  const junkK = list.filter(isJunk).reduce((a,e) => a + kcalOf(e), 0);
  const drinkK = list.filter(e => SUGAR_DRINK_RE.test(e.name) && !/diet|zero/i.test(e.name)).reduce((a,e) => a + kcalOf(e), 0);
  const boozeK = list.filter(e => BOOZE_RE.test(e.name)).reduce((a,e) => a + kcalOf(e), 0);
  const plants = list.some(e => PLANT_RE.test(e.name) || PLANT_EMOJI.includes(e.emoji));
  const ratio = tot.kcal / T.kcal;
  const expP = T.p * frac, remP = Math.round(T.p - tot.p);
  const issues = []; // [penalty, kind, headline, fix line]

  if (ratio > 1.1) {
    const over = E(tot.kcal - T.kcal);
    issues.push([Math.min(40, (ratio-1)*120), "bad",
      pick([`${over} ${u} over. The goal was a number, not a suggestion.`, `You blew past your calories by ${over}. That's not a cheat meal, that's a lifestyle.`, `Over by ${over} ${u}. Your goal didn't stand a chance.`]),
      `<b>Over by ${over} ${u}.</b> Kitchen's closed. Water, then a 30-min walk. Tomorrow, plan dinner before you're hungry.`]);
  }
  if (final && ratio < 0.7) {
    issues.push([25, "bad",
      pick([`You ate ${Math.round(ratio*100)}% of your target. Starving isn't discipline, it backfires.`, `${Math.round(ratio*100)}% of your calories. You're not cutting, you're crashing.`]),
      `<b>Under-ate by ${E(T.kcal - tot.kcal)} ${u}.</b> Eat a real meal: chicken, rice and veg. Starving now means bingeing later.`]);
  }
  if (frac >= 0.35 && remP > 15 && tot.p < expP * 0.75) {
    const chicken = Math.round(remP/31*100/10)*10, whey = Math.ceil(remP/24);
    issues.push([Math.min(30, (1 - tot.p/Math.max(expP,1))*40), "bad",
      pick([`Protein's at ${Math.round(tot.p)} g. Your muscles are filing a complaint.`, `${Math.round(tot.p)} g of protein? That's a snack, not a day.`, `Protein is way behind. You can't build anything on ${Math.round(tot.p)} g.`]),
      `<b>Protein ${Math.round(tot.p)} / ${T.p} g.</b> Get ${remP} g more: about ${chicken} g of chicken breast, or ${whey} scoop${whey>1?"s":""} of whey.`]);
  }
  const junkShare = junkK / Math.max(tot.kcal, 1);
  if (junkK >= 250 && junkShare >= 0.35) {
    issues.push([Math.min(30, junkShare*50), "bad",
      pick([`${Math.round(junkShare*100)}% of today was junk. That's not fuel, that's garbage with a barcode.`, `Most of today came out of a fryer or a wrapper. Be honest with yourself.`, `${Math.round(junkShare*100)}% junk. Your body deserves better than this shit.`]),
      `<b>${Math.round(junkShare*100)}% junk food.</b> Next snack: Greek yogurt, fruit or jerky. Not chips.`]);
  }
  if (drinkK >= 200) {
    issues.push([10, "warn", `You drank ${E(drinkK)} ${u}. Liquid sugar does nothing but make you hungrier.`,
      `<b>${E(drinkK)} ${u} from sugary drinks.</b> Switch to water, black coffee or diet. Free win.`]);
  }
  if (boozeK >= 250) {
    issues.push([15, "warn", `${E(boozeK)} ${u} of booze. Empty calories and wrecked recovery.`,
      `<b>${E(boozeK)} ${u} of alcohol.</b> Cap it at 1–2 drinks and eat protein first.`]);
  }
  if (!plants && (list.length >= 3 || final)) {
    issues.push([10, "warn", `Zero fruit, zero veg. Fibre exists, look it up.`,
      `<b>No fruit or veg.</b> Add a banana, an apple or a bag of salad. Takes 10 seconds.`]);
  }
  const expF = T.f * frac;
  if (frac >= 0.35 && tot.f > expF * 1.3 && tot.f - T.f * frac > 20) {
    issues.push([10, "warn", `Fat's running hot at ${Math.round(tot.f)} g. Ease up on the fried stuff and the butter.`,
      `<b>Fat ${Math.round(tot.f)} / ${T.f} g.</b> Pick grilled over fried, and go light on oil, cheese and sauces.`]);
  }

  issues.sort((a,b) => b[0] - a[0]);
  const score = 100 - issues.reduce((a,x) => a + x[0], 0);
  const grade = score >= 90 ? "A" : score >= 80 ? "B" : score >= 70 ? "C" : score >= 55 ? "D" : "F";

  let head, lines = issues.slice(0,3).map(x => [x[1], x[3]]);
  if (issues.length) head = issues[0][2];
  else if (final) head = pick(["Clean day. Calories on point, protein handled. Do it again tomorrow.", "Locked in. This is what winning looks like. Repeat.", "No notes. Annoyingly good day."]);
  else head = pick(["On track so far. Don't get sloppy at dinner.", "Solid so far. Don't fumble it tonight.", "Good start. Now finish the job."]);
  if (!final && (ratio < 1 || remP > 0)) {
    const leftK = `${E(Math.max(0, T.kcal - tot.kcal))} ${u}`;
    lines.push(["good", remP > 0 ? `<b>Left today:</b> ${leftK} and ${remP} g protein. Lean meat, rice and veg gets it done.`
      : `<b>Protein's handled.</b> ${leftK} left. Keep it clean: veg, fruit or a light protein snack.`]);
  }
  if (!P.setup) lines.push(["warn", `<b>Set your goals</b> in Settings so I can judge you properly.`]);
  lines = lines.slice(0,3);

  const dot = {bad:"var(--red)", warn:"var(--carbs)", good:"var(--good)"};
  box.innerHTML = `<div class="coach-h"><span class="grade" style="background:${GRADE_COL[grade]};${grade==="F"?"color:#fff":""}">${grade}</span>
      <div><span class="flabel">Coach${final ? "" : " · so far"}</span><p class="coach-head">${esc(head)}</p></div></div>
    ${lines.length ? `<ul class="coach-list">${lines.map(([k,t]) => `<li><i style="background:${dot[k]}"></i><span>${t}</span></li>`).join("")}</ul>` : ""}`;
}

  lsSet("quote", i);
  const el = $("quote");
  el.classList.remove("in"); void el.offsetWidth; // restart the fade-in
  $("quoteText").textContent = QUOTES[i];
  el.classList.add("in");
}
